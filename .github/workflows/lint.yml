name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff check and format check
        run: |
          dirs=$(for d in sahyog tests migrations; do [ -d "$d" ] && echo "$d"; done)
          if [ -z "$dirs" ]; then echo "No code yet"; exit 0; fi
          uvx ruff@0.17.3 check $dirs
          uvx ruff@0.17.3 format --check $dirs
