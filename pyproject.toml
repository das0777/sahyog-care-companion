[project]
name = "sahyog"
version = "0.1.0"
description = "Sahyog Care Companion: agentic patient and doctor workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "redis>=5.0",
    "minio>=7.2",
    "faker>=30.0",
    "presidio-analyzer>=2.2.358,<2.3",
    "presidio-anonymizer>=2.2.358,<2.3",
    "spacy>=3.8,<3.9",
    "rapidfuzz>=3.9",
    "anthropic>=0.70",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "en-core-web-sm",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.2,<3.3",
    "reportlab>=5.1.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "pillow>=13.0.0",
    "fastembed>=0.9.1",
    "python-multipart>=0.0.32",
    "faster-whisper>=1.2,<1.3",
    "av>=14,<16",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sahyog"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "TID"]
ignore = ["S101", "S311"]  # asserts in tests; seed RNG is deliberately non-cryptographic

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers and the frozen seed Scale are safe as defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header", "fastapi.Query", "sahyog.seed.generate.Scale"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Vendor SDKs are imported only in sahyog/llm/adapters/; call the ModelGateway"

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"tests/*" = ["S105", "S106"]
"sahyog/llm/adapters/*" = ["TID251"]
"sahyog/graphs/w1_prompts.py" = ["E501", "S105"]  # prose for the model; "PASS" isn't a password
"sahyog/graphs/w1_messages.py" = ["E501"]  # patient messages in three languages
"sahyog/graphs/w2_messages.py" = ["E501"]
"sahyog/graphs/w2_prompts.py" = ["E501", "S105"]
"sahyog/graphs/w3_prompts.py" = ["E501", "S105"]
"tests/test_gateway.py" = ["TID251"]  # adapter tests stub the SDK's HTTP client

[tool.pytest.ini_options]
testpaths = ["tests"]
# macOS sync on the Desktop leaves "name 2.py" copies; they must never count as tests
addopts = "-q --ignore-glob=*\\ 2.py"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
