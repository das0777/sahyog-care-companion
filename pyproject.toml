[project]
name = "sahyog"
version = "0.1.0"
description = "Sahyog Care Companion: agentic patient and doctor workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "redis>=5.0",
    "minio>=7.2",
    "faker>=30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sahyog"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]  # asserts in tests; seed RNG is deliberately non-cryptographic

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers and the frozen seed Scale are safe as defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "sahyog.seed.generate.Scale"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
