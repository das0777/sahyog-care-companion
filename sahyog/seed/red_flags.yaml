# Red-flag rules for the W1 gate. Starter list, NOT clinical guidance: reviewed_by stays null
# until a Sahyog clinician signs it off. Changes go through pull requests like code.
#
# concepts  fire on their own. Each synonym is matched on word windows. Synonyms of 7+ characters
#           are typo-tolerant and may skip one inserted word; shorter ones must match exactly,
#           because fuzzy matching on short words misfires ("fits" vs "fit"). A leading "=" forces
#           an exact match for phrases one letter away from everyday words ("marna chahta" vs
#           "karna chahta", I want to do).
# signals   never fire alone; combinations use them.
# modifiers come from the text (age, conditions) or the patient profile.
# combos    fire when every group in `all_of` has a match and, if `any_modifier` is set,
#           at least one of those modifiers holds.

